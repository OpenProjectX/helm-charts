apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-route
  namespace: {{.Values.namespace }}
spec:
  parentRefs:
    - name: k8s-infra-gateway
      namespace: istio-ingress
  hostnames:
    - {{.Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{.Values.service }}
          port: {{.Values.port }}

---
{{- if .Values.insecureSkipVerify }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{.Values.service }}-backend-tls
  namespace: {{.Values.namespace }}
spec:
  host: {{.Values.service }}.{{.Values.namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
{{- end }}