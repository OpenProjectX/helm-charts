      namespace: istio-ingress

  httpRoutes:
    ui:
      enabled: true
      nameOverride: ""
      hostnames: []
      pathPrefix: /
      serviceName: ""
      port: 8080
      filters: []
      additionalRules: []
    schemaRegistry:
      enabled: true
      nameOverride: ""
      hostnames: []
      pathPrefix: /
      serviceName: ""
      port: 8085
      filters: []
      additionalRules: []

  tcpRoutes:
    kafka:
      enabled: false
      apiVersion: gateway.networking.k8s.io/v1alpha2
      nameOverride: ""
      rules:
        - backendRefs:
            - name: ""
              port: 9092

  virtualServices:
    enabled: true
    apiVersion: networking.istio.io/v1
    services: []
