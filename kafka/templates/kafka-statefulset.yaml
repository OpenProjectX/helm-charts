{{- $root := . -}}
{{- range $cluster := (include "kafka.effectiveClusters" . | fromYamlArray) }}
{{- $ctx := dict "root" $root "cluster" $cluster -}}
{{- $clusterName := include "kafka.cluster.fullname" $ctx -}}
{{- $clusterLabel := include "kafka.cluster.label" $ctx -}}
{{- $serviceName := include "kafka.cluster.serviceName" $ctx -}}
{{- $headlessName := include "kafka.cluster.headlessServiceName" $ctx -}}
{{- $replicas := int (default $root.Values.kafka.replicaCount $cluster.replicaCount) -}}
{{- $brokerIdOffset := int (default $root.Values.kafka.brokerIdOffset $cluster.brokerIdOffset) -}}
{{- $image := default $root.Values.kafka.image.repository (dig "image" "repository" nil $cluster) -}}
{{- $tag := default $root.Values.kafka.image.tag (dig "image" "tag" nil $cluster) -}}
{{- $pullPolicy := default $root.Values.kafka.image.pullPolicy (dig "image" "pullPolicy" nil $cluster) -}}
{{- $serviceType := default $root.Values.kafka.service.type (dig "service" "type" nil $cluster) -}}
{{- $clientName := default $root.Values.kafka.ports.client.name (dig "ports" "client" "name" nil $cluster) -}}
{{- $clientPort := int (default $root.Values.kafka.ports.client.containerPort (dig "ports" "client" "containerPort" nil $cluster)) -}}
{{- $clientServicePort := int (default $root.Values.kafka.ports.client.servicePort (dig "ports" "client" "servicePort" nil $cluster)) -}}
{{- $clientProtocol := default $root.Values.kafka.ports.client.protocol (dig "ports" "client" "protocol" nil $cluster) -}}
{{- $controllerName := default $root.Values.kafka.ports.controller.name (dig "ports" "controller" "name" nil $cluster) -}}
{{- $controllerPort := int (default $root.Values.kafka.ports.controller.containerPort (dig "ports" "controller" "containerPort" nil $cluster)) -}}
{{- $controllerServicePort := int (default $root.Values.kafka.ports.controller.servicePort (dig "ports" "controller" "servicePort" nil $cluster)) -}}
{{- $controllerProtocol := default $root.Values.kafka.ports.controller.protocol (dig "ports" "controller" "protocol" nil $cluster) -}}
{{- $jmxName := default $root.Values.kafka.ports.jmx.name (dig "ports" "jmx" "name" nil $cluster) -}}
{{- $jmxPort := int (default $root.Values.kafka.ports.jmx.containerPort (dig "ports" "jmx" "containerPort" nil $cluster)) -}}
{{- $jmxServicePort := int (default $root.Values.kafka.ports.jmx.servicePort (dig "ports" "jmx" "servicePort" nil $cluster)) -}}
{{- $jmxProtocol := default $root.Values.kafka.ports.jmx.protocol (dig "ports" "jmx" "protocol" nil $cluster) -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $headlessName }}
  labels:
    {{- include "kafka.labels" $root | nindent 4 }}
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: {{ $clusterLabel }}
  {{- with (default $root.Values.kafka.headlessService.annotations (dig "headlessService" "annotations" nil $cluster)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "kafka.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: {{ $clusterLabel }}
  ports:
    - name: {{ $clientName }}
      port: {{ $clientServicePort }}
      targetPort: {{ $clientName }}
      protocol: {{ $clientProtocol }}
    - name: {{ $controllerName }}
      port: {{ $controllerServicePort }}
      targetPort: {{ $controllerName }}
      protocol: {{ $controllerProtocol }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "kafka.labels" $root | nindent 4 }}
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: {{ $clusterLabel }}
  {{- with (default $root.Values.kafka.service.annotations (dig "service" "annotations" nil $cluster)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $serviceType }}
  selector:
    {{- include "kafka.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: {{ $clusterLabel }}
  ports:
    - name: {{ $clientName }}
      port: {{ $clientServicePort }}
      targetPort: {{ $clientName }}
      protocol: {{ $clientProtocol }}
    - name: {{ $jmxName }}
      port: {{ $jmxServicePort }}
      targetPort: {{ $jmxName }}
      protocol: {{ $jmxProtocol }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "kafka.labels" $root | nindent 4 }}
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: {{ $clusterLabel }}
spec:
  serviceName: {{ $headlessName }}
  replicas: {{ $replicas }}
  podManagementPolicy: {{ default $root.Values.kafka.podManagementPolicy $cluster.podManagementPolicy }}
  updateStrategy:
    {{- toYaml (default $root.Values.kafka.updateStrategy $cluster.updateStrategy) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: broker
      app.kubernetes.io/part-of: {{ $clusterLabel }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: {{ $clusterLabel }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $cluster.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (default $root.Values.podAnnotations $cluster.podAnnotations) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.kafka.securityContext $cluster.securityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kafka
          image: "{{ $image }}:{{ $tag }}"
          imagePullPolicy: {{ $pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              ORDINAL="${HOSTNAME##*-}"
              NODE_ID=$((ORDINAL + {{ $brokerIdOffset }}))
              POD_FQDN="${HOSTNAME}.{{ $headlessName }}.{{ include "kafka.namespace" $root }}.svc.{{ include "kafka.clusterDomain" $root }}"
              export KAFKA_NODE_ID="${NODE_ID}"
              export KAFKA_BROKER_ID="${NODE_ID}"
              export KAFKA_PROCESS_ROLES="{{ default $root.Values.kafka.processRoles $cluster.processRoles }}"
              export KAFKA_CONTROLLER_QUORUM_VOTERS="{{ include "kafka.cluster.controllerQuorum" $ctx }}"
              export KAFKA_CONTROLLER_LISTENER_NAMES="CONTROLLER"
              export KAFKA_LISTENER_SECURITY_PROTOCOL_MAP="{{ default $root.Values.kafka.listenerSecurityProtocolMap $cluster.listenerSecurityProtocolMap }}"
              export KAFKA_LISTENERS="SASL_PLAINTEXT://0.0.0.0:{{ $clientPort }},CONTROLLER://${POD_FQDN}:{{ $controllerPort }}"
              export KAFKA_ADVERTISED_LISTENERS="SASL_PLAINTEXT://${POD_FQDN}:{{ $clientPort }}"
              export KAFKA_INTER_BROKER_LISTENER_NAME="{{ default $root.Values.kafka.interBrokerListenerName $cluster.interBrokerListenerName }}"
              export KAFKA_SASL_ENABLED_MECHANISMS="{{ default $root.Values.kafka.saslEnabledMechanisms $cluster.saslEnabledMechanisms }}"
              export KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL="{{ default $root.Values.kafka.saslMechanismInterBrokerProtocol $cluster.saslMechanismInterBrokerProtocol }}"
              export KAFKA_SASL_KERBEROS_SERVICE_NAME="{{ default $root.Values.kafka.saslKerberosServiceName $cluster.saslKerberosServiceName }}"
              export KAFKA_LOG_DIRS="{{ default $root.Values.kafka.logDirs $cluster.logDirs }}"
              export KAFKA_JMX_PORT="{{ $jmxPort }}"
              export KAFKA_JMX_HOSTNAME="${POD_FQDN}"
              export CLUSTER_ID="{{ required (printf "kafka cluster %s requires clusterId" $clusterLabel) (default $root.Values.kafka.clusterId $cluster.clusterId) }}"
              {{- range $name, $value := mergeOverwrite (deepCopy $root.Values.kafka.config) (default dict $cluster.config) }}
              export {{ $name }}={{ $value | quote }}
              {{- end }}
              {{- if and $root.Values.kerberos.enabled (default $root.Values.kafka.kerberos.enabled (dig "kerberos" "enabled" nil $cluster)) }}
              KAFKA_KEYTAB="$(printf "{{ include "kafka.cluster.keytabPattern" $ctx }}" "${ORDINAL}")"
              KAFKA_PRINCIPAL="$(printf "{{ default $root.Values.kafka.kerberos.principalPattern (dig "kerberos" "principalPattern" nil $cluster) }}" "${POD_FQDN}")"
              cat > {{ default $root.Values.kafka.kerberos.jaasPath (dig "kerberos" "jaasPath" nil $cluster) }} <<EOF
              KafkaServer {
                com.sun.security.auth.module.Krb5LoginModule required
                useKeyTab=true
                storeKey=true
                keyTab="${KAFKA_KEYTAB}"
                principal="${KAFKA_PRINCIPAL}";
              };
              EOF
              export KAFKA_OPTS="-Djava.security.krb5.conf={{ $root.Values.kerberos.krb5ConfigPath }} -Djava.security.auth.login.config={{ default $root.Values.kafka.kerberos.jaasPath (dig "kerberos" "jaasPath" nil $cluster) }} ${KAFKA_OPTS:-}"
              {{- end }}
              {{- if (default $root.Values.kafka.jaas.enabled (dig "jaas" "enabled" nil $cluster)) }}
              cat > {{ default $root.Values.kafka.jaas.path (dig "jaas" "path" nil $cluster) }} <<'EOF'
              {{- default $root.Values.kafka.jaas.config (dig "jaas" "config" nil $cluster) | nindent 14 }}
              EOF
              export KAFKA_OPTS="-Djava.security.auth.login.config={{ default $root.Values.kafka.jaas.path (dig "jaas" "path" nil $cluster) }} ${KAFKA_OPTS:-}"
              {{- end }}
              exec /etc/kafka/docker/run
          ports:
            - name: {{ $clientName }}
              containerPort: {{ $clientPort }}
              protocol: {{ $clientProtocol }}
            - name: {{ $controllerName }}
              containerPort: {{ $controllerPort }}
              protocol: {{ $controllerProtocol }}
            - name: {{ $jmxName }}
              containerPort: {{ $jmxPort }}
              protocol: {{ $jmxProtocol }}
          env:
            - name: KAFKA_SUPER_USERS
              value: {{ join ";" (default $root.Values.kafka.superUsers $cluster.superUsers) | quote }}
            {{- with (concat (default list $root.Values.kafka.env) (default list $cluster.env)) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (concat (default list $root.Values.kafka.extraEnvFrom) (default list $cluster.extraEnvFrom)) }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if (default $root.Values.kafka.persistence.enabled (dig "persistence" "enabled" nil $cluster)) }}
            - name: data
              mountPath: {{ default $root.Values.kafka.persistence.mountPath (dig "persistence" "mountPath" nil $cluster) }}
            {{- end }}
            {{- if $root.Values.kerberos.enabled }}
            - name: kerberos
              mountPath: {{ $root.Values.kerberos.mountPath }}
              readOnly: true
            {{- end }}
            {{- with (concat (default list $root.Values.kafka.extraVolumeMounts) (default list $cluster.extraVolumeMounts)) }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with (default $root.Values.kafka.containerSecurityContext $cluster.containerSecurityContext) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (default $root.Values.kafka.resources $cluster.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with (default $root.Values.nodeSelector $cluster.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.affinity $cluster.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $root.Values.tolerations $cluster.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if $root.Values.kerberos.enabled }}
        - name: kerberos
          {{- if and $root.Values.kerberos.kdc.enabled (not $root.Values.kerberos.existingSecret) }}
          persistentVolumeClaim:
            claimName: {{ include "kafka.fullname" $root }}-kdc
          {{- else }}
          secret:
            secretName: {{ include "kafka.kerberosSecretName" $root }}
            {{- with $root.Values.kerberos.existingSecretItems }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- with (concat (default list $root.Values.kafka.extraVolumes) (default list $cluster.extraVolumes)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if (default $root.Values.kafka.persistence.enabled (dig "persistence" "enabled" nil $cluster)) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml (default $root.Values.kafka.persistence.accessModes (dig "persistence" "accessModes" nil $cluster)) | nindent 10 }}
        resources:
          requests:
            storage: {{ default $root.Values.kafka.persistence.size (dig "persistence" "size" nil $cluster) }}
        {{- with (default $root.Values.kafka.persistence.storageClassName (dig "persistence" "storageClassName" nil $cluster)) }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{ end }}
