{{- if not .Values.postgres.auth.existingSecret }}
{{- $password := required "postgres.auth.password is required when postgres.auth.existingSecret is empty" .Values.postgres.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bitmagnet.postgresSecretName" . }}
  labels:
    {{- include "bitmagnet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.usernameKey }}: {{ .Values.postgres.auth.username | quote }}
  {{ .Values.postgres.auth.passwordKey }}: {{ $password | quote }}
{{- end }}

