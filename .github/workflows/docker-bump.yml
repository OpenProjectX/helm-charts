name: Docker Auto Bump

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    if: startsWith(github.event.head_commit.message, 'bump(docker):')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------
      # Extract target directory from commit message
      # --------------------------------------------
      - name: Parse commit message
        id: parse
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$COMMIT_MESSAGE"
          DIR=$(echo "$MSG" | head -n1 | sed -E 's/^bump\(docker\):[[:space:]]*//')
          if [[ ! "$DIR" =~ ^docker/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Invalid Docker directory: $DIR" >&2
            exit 1
          fi
          if [ ! -f "$DIR/Dockerfile" ]; then
            echo "Dockerfile not found: $DIR/Dockerfile" >&2
            exit 1
          fi
          IMAGE_NAME=$(basename "$DIR")

          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      # --------------------------------------------
      # Login to GHCR
      # --------------------------------------------
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # --------------------------------------------
      # Get latest version from GHCR
      # --------------------------------------------
      - name: Determine next version
        id: version
        run: |
          IMAGE="ghcr.io/openprojectx/${{ steps.parse.outputs.image_name }}"

          echo "Checking existing tags for $IMAGE"

          TAGS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://ghcr.io/v2/openprojectx/${{ steps.parse.outputs.image_name }}/tags/list \
            | jq -r '.tags[]? | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -V)

          if [ -z "$TAGS" ]; then
            VERSION="0.1.0"
          else
            LATEST=$(echo "$TAGS" | tail -n1)
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            PATCH=$((PATCH + 1))
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # --------------------------------------------
      # Setup Docker Buildx
      # --------------------------------------------
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------
      # Persist downloaded artifacts across runs.
      # Dockerfiles opt in by downloading through a
      #   RUN --mount=type=cache,target=/var/cache/downloads
      # cache mount (Temurin, Node, Docker static tarballs, etc.).
      # --------------------------------------------
      - name: Cache downloaded artifacts
        id: artifact-cache
        uses: actions/cache@v4
        with:
          path: downloads-cache
          key: downloads-${{ steps.parse.outputs.image_name }}-${{ hashFiles(format('{0}/Dockerfile', steps.parse.outputs.dir)) }}
          restore-keys: |
            downloads-${{ steps.parse.outputs.image_name }}-

      - name: Inject artifact cache into buildkit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "downloads-cache": "/var/cache/downloads"
            }
          skip-extraction: ${{ steps.artifact-cache.outputs.cache-hit }}

      # --------------------------------------------
      # Build & Push with registry cache
      # --------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          ACTIONS_STEP_DEBUG: true
        with:
          context: ${{ steps.parse.outputs.dir }}
          push: true
          progress: plain
          tags: |
            ghcr.io/openprojectx/${{ steps.parse.outputs.image_name }}:${{ steps.version.outputs.version }}
            ghcr.io/openprojectx/${{ steps.parse.outputs.image_name }}:latest
          cache-from: type=registry,ref=ghcr.io/openprojectx/${{ steps.parse.outputs.image_name }}-cache:latest
          cache-to: type=registry,ref=ghcr.io/openprojectx/${{ steps.parse.outputs.image_name }}-cache:latest,mode=max

      # The upstream Playwright image has browsers but no npm Playwright CLI.
      # Verify our derived server image contains both and works without network.
      - name: Verify offline Playwright server runtime
        if: steps.parse.outputs.image_name == 'playwright-server'
        run: |
          IMAGE="ghcr.io/openprojectx/${{ steps.parse.outputs.image_name }}:${{ steps.version.outputs.version }}"
          docker pull "$IMAGE"
          bash docker/playwright-server/verify-offline.sh "$IMAGE"
